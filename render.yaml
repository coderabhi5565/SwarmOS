# Render Blueprint: the SwarmOS API as the public demo, on the free plan.
# The frontend is deployed separately on Cloudflare Pages, which forwards
# /api/* and /health here (frontend/functions); see README "Deployment".
#
# Free-plan storage is ephemeral: run history and accounts reset whenever
# the service restarts or sleeps.
services:
  - type: web
    name: swarmos-api
    runtime: python
    plan: free
    # Editable, so repo-relative files (benchmarks/tasks.jsonl,
    # samples/sample_project) resolve from the checkout, not site-packages.
    buildCommand: pip install -e ".[dev]"
    startCommand: swarmos serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Pinned to the version the test suite runs on locally (Render's
      # default for new services is newer).
      - key: PYTHON_VERSION
        value: "3.13.3"
      # The restricted profile; the server refuses to start without its checks.
      - key: SWARMOS_MODE
        value: public_demo
      - key: SWARMOS_EXECUTION_SANDBOX
        value: restricted
      - key: SWARMOS_CODE_POLICY
        value: "1"
      - key: SWARMOS_ALLOW_REMOTE_BIND
        value: "1"
      # Render's proxy terminates TLS: trust its X-Forwarded-For for rate
      # limits, and mark the session cookie Secure.
      - key: SWARMOS_TRUST_PROXY_HEADERS
        value: "1"
      # The Pages site's origin, e.g. https://<project>.pages.dev; only needed
      # when the browser calls this API directly rather than through Pages.
      - key: SWARMOS_CORS_ORIGINS
        sync: false
      # The account registered with this email is an operator. Emails are not
      # verified: leave empty, or use an address nobody else knows.
      - key: SWARMOS_OPERATOR_EMAIL
        sync: false
      # An operator bearer token, generated by Render (read it in the dashboard).
      - key: SWARMOS_API_TOKEN
        generateValue: true
